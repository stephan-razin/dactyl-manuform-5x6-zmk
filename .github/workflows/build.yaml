name: Build Dactyl 6x6

on:
  push:
    branches: [ main ]

jobs:
  build_left:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup ZMK
        uses: zmkfirmware/setup-zmk@main

      - name: Build Left (Studio)
        run: |
          west build -d build/left -b nice_nano_v2 \
            -- -DSHIELD=dactyl_ergo_6x6_left -DCONFIG_ZMK_STUDIO=y

      - name: Upload Left Firmware
        uses: actions/upload-artifact@v4
        with:
          name: dactyl-left-studio
          path: build/left/zephyr/zmk.uf2

  build_right:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup ZMK
        uses: zmkfirmware/setup-zmk@main

      - name: Build Right
        run: |
          west build -d build/right -b nice_nano_v2 \
            -- -DSHIELD=dactyl_ergo_6x6_right

      - name: Upload Right Firmware
        uses: actions/upload-artifact@v4
        with:
          name: dactyl-right
          path: build/right/zephyr/zmk.uf2
